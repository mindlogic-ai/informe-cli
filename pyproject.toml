[project]
name = "informe-cli"
version = "0.1.0"
description = "Informe in your terminal — chat, sessions, files, everything the SPA shows"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
informe = "informe_cli.main:app"
inf = "informe_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/informe_cli"]

[tool.hatch.build.targets.wheel.force-include]
"skill/SKILL.md" = "informe_cli/skill/SKILL.md"
"skills" = "informe_cli/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
